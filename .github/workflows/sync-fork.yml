name: Sync fork with upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPOSITORY: LancelotRar/best-cf-ips
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main

jobs:
  sync:
    name: Sync fork
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and sync
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPOSITORY }}.git
          git fetch upstream ${{ env.UPSTREAM_BRANCH }}
          git checkout ${{ env.TARGET_BRANCH }}
          # 使用 merge 或 rebase 将 upstream 的更新合并到本地目标分支
          git merge upstream/${{ env.UPSTREAM_BRANCH }} --no-edit

      - name: Push changes
        run: |
          # 只有在有改动时才推送，避免无谓的报错
          git push origin ${{ env.TARGET_BRANCH }}

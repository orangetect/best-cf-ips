name: Upstream Sync Multi-Branch

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 时间 0点执行
  workflow_dispatch:

jobs:
  sync_branches:
    name: Sync branch ${{ matrix.branch }}
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    
    # 定义需要同步的分支矩阵
    strategy:
      fail-fast: false
      matrix:
        branch: [main] # 👈 在这里添加你需要同步的所有分支名字

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ matrix.branch }}

      - name: Sync upstream changes for ${{ matrix.branch }}
        run: |
          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"

          git remote add upstream https://github.com/LancelotRar/best-cf-ips
          git fetch upstream ${{ matrix.branch }}

          if git diff --quiet HEAD upstream/${{ matrix.branch }}; then
            echo "Branch ${{ matrix.branch }} is up to date, resetting..."
            git reset --hard upstream/${{ matrix.branch }}
            git push --force-with-lease origin ${{ matrix.branch }}
          else
            echo "Merging upstream changes for ${{ matrix.branch }}..."
            if ! git pull --no-rebase upstream ${{ matrix.branch }}; then
              echo "[Error] 分支 ${{ matrix.branch }} 合并上游变更产生冲突，自动同步已暂停。"
              exit 1
            fi
            git push origin ${{ matrix.branch }}
          fi

